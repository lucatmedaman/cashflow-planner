# Preview-deploy voor de TEST-site. Basisdirectory is deze submap.
[build]
  base = "medaman-site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Zolang dit een testomgeving is: nergens indexeren.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
