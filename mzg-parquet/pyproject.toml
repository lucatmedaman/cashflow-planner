[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mzg-parquet"
version = "1.0.0"
description = "MZG/RHM-registratiebestanden inlezen volgens de recordtekeningen van de FOD Volksgezondheid en exporteren als Parquet"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyarrow>=15"]

[project.optional-dependencies]
# enkel nodig om mzg_schema.json opnieuw af te leiden uit de richtlijnen-PDF's
schema = ["pypdf>=4"]

[project.scripts]
mzg-parquet = "mzg_parquet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mzg_parquet = ["mzg_schema.json"]
